[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "streamingdownloader"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "cloudscraper>=1.2.71",
    "beautifulsoup4>=4.12",
    "m3u8>=4.0",
    "cryptography>=42.0",
    "rich>=13.7",
    "questionary>=2.0",
]

[project.scripts]
sdl = "sdl.__main__:run"

[tool.setuptools]
packages = ["sdl", "sdl.sources"]

[tool.setuptools.dynamic]
version = { attr = "sdl.__version__" }
